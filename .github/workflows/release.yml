name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Verify wheel entry point
        run: |
          python -m venv /tmp/release-package-venv
          /tmp/release-package-venv/bin/python -m pip install --no-deps dist/*.whl
          /tmp/release-package-venv/bin/ephbuf --help

      - name: Generate distribution checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Attest release distributions
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ephemeral-buffer-mcp-${{ github.ref_name }}
          path: dist/
