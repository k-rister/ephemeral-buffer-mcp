name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Verify wheel entry point
        run: |
          python -m venv /tmp/release-package-venv
          /tmp/release-package-venv/bin/python -m pip install --no-deps dist/*.whl
          /tmp/release-package-venv/bin/agy-cap --help

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: ephemeral-buffer-mcp-${{ github.ref_name }}
          path: dist/
