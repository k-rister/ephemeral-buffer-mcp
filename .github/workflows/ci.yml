name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache FastEmbed model
        uses: actions/cache@v5
        with:
          path: /tmp/fastembed_cache
          key: fastembed-${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'engine.py') }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt coverage build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify installed CLI entry point
        run: |
          python -m venv /tmp/ephemeral-package-venv
          /tmp/ephemeral-package-venv/bin/python -m pip install --no-deps dist/*.whl
          /tmp/ephemeral-package-venv/bin/agy-cap --help

      - name: Compile sources
        run: python -m py_compile cli.py config.py engine.py server.py capture_utils.py

      - name: Run focused tests
        run: python -m coverage run --source=. --omit='test_*.py,benchmark_concurrency.py' -m unittest test_engine.py test_capture_utils.py test_config.py test_cli.py test_server.py

      - name: Report coverage
        run: |
          python -m coverage report --fail-under=80
          python -m coverage xml
          python -m coverage html

      - name: Run end-to-end test
        run: python -m unittest test_e2e_pipe.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
