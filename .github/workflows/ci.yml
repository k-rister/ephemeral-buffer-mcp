name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile sources
        run: python -m py_compile cli.py config.py engine.py server.py capture_utils.py

      - name: Run focused tests
        run: python -m unittest test_engine.py test_capture_utils.py test_config.py test_cli.py

      - name: Run end-to-end test
        run: python -m unittest test_e2e_pipe.py
