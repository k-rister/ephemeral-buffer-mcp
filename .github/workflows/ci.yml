name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EPHEMERAL_FASTEMBED_CACHE_DIR: /tmp/fastembed_cache
      EPHEMERAL_TEST_EMBEDDINGS: "1"
      EPHEMERAL_REQUIRE_ISOLATION: "1"
      EPHEMERAL_SESSION_ID: "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache FastEmbed model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/fastembed_cache
          key: fastembed-${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'src/ephemeral_buffer_mcp/engine.py') }}

      - name: Install dependencies
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pip install --require-hashes -r requirements-dev-lock-py312.txt
          else
            # Python 3.10 uses scripts/release_checks.py's tomli fallback for TOML parsing.
            python -m pip install -r requirements.txt -c constraints.txt coverage build pip-audit tomli==2.4.1
          fi

      - name: Install project in editable mode
        run: python -m pip install --no-deps -e .

      - name: Audit dependencies
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pip_audit -r requirements-lock-py312.txt
          else
            python -m pip_audit -r requirements.txt
          fi

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify installed CLI entry point
        run: |
          python -m venv /tmp/ephemeral-package-venv
          /tmp/ephemeral-package-venv/bin/python -m pip install -c constraints.txt dist/*.whl
          /tmp/ephemeral-package-venv/bin/ephbuf --help
          /tmp/ephemeral-package-venv/bin/python -c "from ephemeral_buffer_mcp.metrics import LocalMetrics; assert LocalMetrics"
          smoke_workdir="$(mktemp -d)"
          trap 'rm -rf "$smoke_workdir"' EXIT
          (
            cd "$smoke_workdir"
            /tmp/ephemeral-package-venv/bin/python "$GITHUB_WORKSPACE/scripts/installed_package_mcp_smoke.py"
          )

      - name: Compile sources
        run: python -m compileall -q src benchmarks scripts

      - name: Run focused tests
        env:
          EPHEMERAL_SOCKET_PATH: ${{ runner.temp }}/ephemeral-buffer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}.sock
          EPHEMERAL_EXECUTION_STATE_DIR: ${{ runner.temp }}/ephemeral-buffer-executions-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}
          EPHEMERAL_METRICS_FILE: ${{ runner.temp }}/ephemeral-buffer-metrics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}.json
        run: |
          ./scripts/with-test-env.sh python -u -m coverage run --source=ephemeral_buffer_mcp -m unittest -v \
            tests.unit.test_admission tests.benchmarks.test_benchmark_concurrency tests.benchmarks.test_benchmark_effectiveness \
            tests.benchmarks.test_benchmark_latency tests.benchmarks.test_benchmark_routing tests.benchmarks.test_benchmark_prefetch \
            tests.benchmarks.test_benchmark_semantic_index tests.benchmarks.test_benchmark_semantic_memory tests.benchmarks.test_benchmark_warmup \
            tests.benchmarks.test_benchmark_relevance tests.benchmarks.test_benchmark_agent_ab tests.benchmarks.test_benchmark_agent_ab_fixtures \
            tests.benchmarks.test_benchmark_agent_ab_repository_fixture tests.benchmarks.test_benchmark_agent_ab_baseline \
            tests.benchmarks.test_run_codex_agent_ab tests.tooling.test_release_checks tests.benchmarks.test_workload_results \
            tests.benchmarks.test_compare_workload_results tests.benchmarks.test_list_workload_results tests.tooling.test_ci_workflow \
            tests.unit.test_mcpserver_adapter tests.unit.test_engine tests.unit.test_capture_utils tests.unit.test_config \
            tests.unit.test_cli tests.unit.test_socket_protocol tests.unit.test_server tests.unit.test_metrics \
            tests.unit.test_logging_utils tests.unit.test_execution tests.unit.test_execution_server

      - name: Report coverage
        run: |
          python -m coverage report -m --fail-under=100
          python -m coverage xml
          python -m coverage html

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Report release guardrail coverage
        env:
          EPHEMERAL_SOCKET_PATH: ${{ runner.temp }}/ephemeral-buffer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}.sock
          EPHEMERAL_EXECUTION_STATE_DIR: ${{ runner.temp }}/ephemeral-buffer-executions-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}
          EPHEMERAL_METRICS_FILE: ${{ runner.temp }}/ephemeral-buffer-metrics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}.json
        run: |
          rm -f .coverage.release
          COVERAGE_FILE=.coverage.release ./scripts/with-test-env.sh python -m coverage run --source=scripts.release_checks -m unittest tests.tooling.test_release_checks
          COVERAGE_FILE=.coverage.release python -m coverage report --include='scripts/release_checks.py' --fail-under=100

      - name: Run end-to-end test
        env:
          EPHEMERAL_SOCKET_PATH: ${{ runner.temp }}/ephemeral-buffer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}.sock
          EPHEMERAL_EXECUTION_STATE_DIR: ${{ runner.temp }}/ephemeral-buffer-executions-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}
          EPHEMERAL_METRICS_FILE: ${{ runner.temp }}/ephemeral-buffer-metrics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}.json
        run: ./scripts/with-test-env.sh python -m unittest tests.integration.test_e2e_pipe

      - name: Run effectiveness smoke evaluation
        run: python -m benchmarks.benchmark_effectiveness --mode both --output benchmark-effectiveness.json > /dev/null

      - name: Run paired effectiveness evaluation
        run: python -m benchmarks.benchmark_effectiveness --ab-runs 5 --output benchmark-effectiveness-ab.json > /dev/null

      - name: Run consolidation effectiveness evaluation
        run: python -m benchmarks.benchmark_effectiveness --consolidation-runs 5 --output benchmark-effectiveness-consolidation.json > /dev/null

      - name: Run search relevance evaluation
        run: python -m benchmarks.benchmark_relevance --baseline benchmarks/data/benchmark_relevance_baseline.json --fail-on-regression --output search-relevance.json > /dev/null

      - name: Run capture latency evaluation
        run: python -m benchmarks.benchmark_latency --samples 3 --output benchmark-latency.json > /dev/null

      - name: Add relevance baseline summary
        if: always()
        run: |
          {
            echo '## Search relevance baseline'
            echo
            if [ -f search-relevance.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("search-relevance.json").read_text())
          comparison = result.get("baseline_comparison")
          if comparison is None:
              print("- No baseline comparison was produced.")
          else:
              print(f"- Status: `{'passed' if comparison['passed'] else 'failed'}`")
              for mode, metrics in comparison["comparisons"].items():
                  values = ", ".join(
                      f"{metric}={data['current']:.3f} (Δ {data['delta']:+.3f})"
                      for metric, data in metrics.items()
                  )
                  print(f"- `{mode}`: {values}")
              for regression in comparison["regressions"]:
                  print(f"- Regression: {regression}")
          PY
            else
              echo '- No relevance result JSON was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            benchmark-effectiveness.json
            benchmark-effectiveness-ab.json
            benchmark-effectiveness-consolidation.json
            search-relevance.json
            benchmark-latency.json

  mcp-sdk-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-spec: ["mcp==2.3.0", "mcp>=2.3.0,<3"]
    env:
      EPHEMERAL_TEST_EMBEDDINGS: "1"
      EPHEMERAL_REQUIRE_ISOLATION: "1"
      EPHEMERAL_SESSION_ID: "mcp-sdk-compat-${{ github.run_id }}-${{ strategy.job-index }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "${{ matrix.mcp-spec }}"

      - name: Install project in editable mode
        run: python -m pip install --no-deps -e .

      - name: Check adapter and MCP behavior
        run: ./scripts/with-test-env.sh python -m unittest -v tests.unit.test_mcpserver_adapter tests.unit.test_server tests.unit.test_execution_server

  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      EPHEMERAL_FASTEMBED_CACHE_DIR: /tmp/fastembed_cache
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache FastEmbed model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/fastembed_cache
          key: benchmark-fastembed-${{ runner.os }}-python-3.12-${{ hashFiles('requirements.txt', 'src/ephemeral_buffer_mcp/engine.py') }}

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-lock-py312.txt

      - name: Install project in editable mode
        run: python -m pip install --no-deps -e .

      - name: Run concurrency benchmark
        run: |
          set -o pipefail
          python -m benchmarks.benchmark_concurrency \
            --captures 32 \
            --workers 8 \
            --baseline benchmarks/data/benchmark_baseline.json \
            --output benchmark-concurrency.json \
            | tee benchmark-concurrency.txt

      - name: Run admission saturation benchmark
        run: |
          set -o pipefail
          python -m benchmarks.benchmark_admission \
            --repetitions 3 \
            --output benchmark-admission.json \
            --result benchmark-admission.result.json \
            | tee benchmark-admission.txt

      - name: Run capture latency benchmark
        run: |
          set -o pipefail
          python -m benchmarks.benchmark_latency \
            --samples 5 \
            --output benchmark-latency.json \
            | tee benchmark-latency.txt

      - name: Add benchmark summary
        if: always()
        run: |
          {
            echo '## Concurrency benchmark'
            echo
            if [ -f benchmark-concurrency.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("benchmark-concurrency.json").read_text())
          status = "passed" if result["passed"] else "failed"
          print(f"- Captures/workers: `{result['captures']}/{result['workers']}`")
          print(f"- Ingest: `{result['ingest_per_second']:.2f}/s`")
          print(f"- Reads: `{result['reads_per_second']:.2f}/s`")
          print(f"- Regression policy: `{status}`")
          if result["regressions"]:
              print("- Details:")
              for failure in result["regressions"]:
                  print(f"  - {failure}")
          PY
            else
              echo '- No result JSON was produced.'
            fi
            echo
            echo '## Admission saturation benchmark'
            echo
            if [ -f benchmark-admission.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("benchmark-admission.json").read_text())
          for transport in ("mcp", "socket"):
              summary = result["scenarios"][transport]
              print(
                  f"- `{transport}`: success={summary['success_rate']:.3f}, "
                  f"busy_rejection={summary['busy_rejection_rate']:.3f}, "
                  f"accepted throughput={summary['accepted_throughput_per_second_median']:.2f}/s, "
                  f"active/queued={summary['max_active_at_saturation']}/"
                  f"{summary['max_queued_at_saturation']}, "
                  f"{'passed' if summary['passed'] else 'failed'}"
              )
              for failure in summary["errors"]:
                  print(f"  - {failure}")
          PY
            else
              echo '- No admission result JSON was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: concurrency-benchmark-${{ github.run_number }}
          retention-days: 90
          path: |
            benchmark-concurrency.txt
            benchmark-concurrency.json
            benchmark-admission.txt
            benchmark-admission.json
            benchmark-admission.result.json
            benchmark-latency.txt
            benchmark-latency.json
