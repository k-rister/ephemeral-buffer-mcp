name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EPHEMERAL_FASTEMBED_CACHE_DIR: /tmp/fastembed_cache
      EPHEMERAL_TEST_EMBEDDINGS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache FastEmbed model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/fastembed_cache
          key: fastembed-${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'engine.py') }}

      - name: Install dependencies
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pip install --require-hashes -r requirements-dev-lock-py312.txt
          else
            python -m pip install -r requirements.txt -c constraints.txt coverage build pip-audit
          fi

      - name: Audit dependencies
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pip_audit -r requirements-lock-py312.txt
          else
            python -m pip_audit -r requirements.txt
          fi

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify installed CLI entry point
        run: |
          python -m venv /tmp/ephemeral-package-venv
          /tmp/ephemeral-package-venv/bin/python -m pip install --no-deps dist/*.whl
          /tmp/ephemeral-package-venv/bin/ephbuf --help

      - name: Compile sources
        run: python -m py_compile cli.py config.py engine.py server.py capture_utils.py

      - name: Run focused tests
        run: python -u -m coverage run --source=. --omit='test_*.py,benchmark_concurrency.py' -m unittest -v test_engine.py test_capture_utils.py test_config.py test_cli.py test_server.py

      - name: Report coverage
        run: |
          python -m coverage report --fail-under=91
          python -m coverage xml
          python -m coverage html

      - name: Run end-to-end test
        run: python -m unittest test_e2e_pipe.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      EPHEMERAL_FASTEMBED_CACHE_DIR: /tmp/fastembed_cache
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache FastEmbed model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/fastembed_cache
          key: benchmark-fastembed-${{ runner.os }}-python-3.12-${{ hashFiles('requirements.txt', 'engine.py') }}

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-lock-py312.txt

      - name: Run concurrency benchmark
        run: |
          python benchmark_concurrency.py \
            --captures 32 \
            --workers 8 \
            --min-ingest-per-second 1.0 \
            --min-reads-per-second 1000 \
            | tee benchmark-concurrency.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: concurrency-benchmark-${{ github.run_number }}
          path: benchmark-concurrency.txt
