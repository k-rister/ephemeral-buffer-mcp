[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-buffer-mcp"
version = "0.9.0"
description = "Ephemeral in-memory command output capture and hybrid search MCP server for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Karl Rister", email = "krister@redhat.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "fastembed>=0.7.0",
    "numpy>=1.24.0",
    "urllib3>=2.8.0"
]

[project.urls]
Homepage = "https://github.com/k-rister/ephemeral-buffer-mcp"
Repository = "https://github.com/k-rister/ephemeral-buffer-mcp"
Issues = "https://github.com/k-rister/ephemeral-buffer-mcp/issues"

[project.scripts]
ephbuf = "ephemeral_buffer_mcp.cli:main"
ephemeral-config = "ephemeral_buffer_mcp.config:main"

[tool.setuptools]
package-dir = { "" = "src" }
# These Bash launchers source the session helper and must be installed as files.
script-files = ["ephemeral-agent", "codex-ephemeral", "ephemeral-session-env"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ephemeral_buffer_mcp*"]
