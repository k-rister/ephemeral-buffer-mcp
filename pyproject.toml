[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-buffer-mcp-core"
version = "0.11.0"
description = "Shared runtime core for the Ephemeral Buffer MCP server"
readme = "CORE_README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Karl Rister", email = "krister@redhat.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "urllib3>=2.8.0"
]

[project.optional-dependencies]
semantic = [
    "filelock>=4.2.1,<5",
    "huggingface-hub>=0.20,<2",
    "numpy>=1.24.0",
    "onnxruntime>=1.17,<2",
    "tokenizers>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/k-rister/ephemeral-buffer-mcp"
Repository = "https://github.com/k-rister/ephemeral-buffer-mcp"
Issues = "https://github.com/k-rister/ephemeral-buffer-mcp/issues"

[project.scripts]
ephbuf = "ephemeral_buffer_mcp.cli:main"
ephemeral-config = "ephemeral_buffer_mcp.config:main"

[tool.setuptools]
package-dir = { "" = "src" }
# These Bash launchers source the session helper and must be installed as files.
script-files = ["ephemeral-agent", "codex-ephemeral", "ephemeral-session-env"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ephemeral_buffer_mcp*"]
