[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-buffer-mcp-lexical"
version = "0.12.0"
description = "Lexical-only Ephemeral Buffer MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Karl Rister", email = "krister@redhat.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = ["ephemeral-buffer-mcp-core==0.11.0"]

[project.urls]
Homepage = "https://github.com/k-rister/ephemeral-buffer-mcp"
Repository = "https://github.com/k-rister/ephemeral-buffer-mcp"
Issues = "https://github.com/k-rister/ephemeral-buffer-mcp/issues"

[tool.setuptools]
packages = []
